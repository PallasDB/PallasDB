codecov:
  require_ci_to_pass: true

coverage:
  status:
    # A ratchet, not a cliff. `auto` compares against the base commit, so a PR
    # fails if it makes overall coverage worse by more than the threshold. That
    # encodes "never regress" instead of a number someone guessed, and it needs
    # no maintenance as coverage climbs.
    #
    # Recorded starting point: at the merge base of the release-engineering
    # wave, project coverage was 57.4% (db 85.9%, cmd/pallasdb 71.0%,
    # cluster/discovery 22.9%, grpc 15.8%, cluster 0.0%). Do not quote that as
    # current — the cluster and grpc holes were being filled in the same wave.
    project:
      default:
        target: auto
        threshold: 1%
    # New code is held to a real number. Unlike the project target, 80% on a
    # diff is achievable from day one, and it is the rule that actually keeps
    # coverage moving in the right direction.
    patch:
      default:
        target: 80%

# The upload itself is blocking: .github/workflows/test.yml sets
# `fail_ci_if_error: true`. Without that, a dropped upload left these targets
# permanently unevaluated and the gate was advisory in practice.
comment:
  layout: "reach, diff, flags, files"
  require_changes: true

ignore:
  - "pb/**"          # generated by protoc-gen-go; see .github/workflows/proto.yml
  - "benchmarks/**"  # recorded artifacts, not code
