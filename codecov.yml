codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 2%
    patch:
      default:
        target: 80%

# The upload itself is blocking: .github/workflows/test.yml sets
# `fail_ci_if_error: true`. Without that, a dropped upload left these targets
# permanently unevaluated and the gate was advisory in practice.
comment:
  layout: "reach, diff, flags, files"
  require_changes: true

ignore:
  - "pb/**"          # generated by protoc-gen-go; see .github/workflows/proto.yml
  - "benchmarks/**"  # recorded artifacts, not code
