syntax = "proto3";

package pallasdb.v1;

option go_package = "github.com/teddymalhan/pallasdb/pb/v1;pbv1";

service KVService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Range(RangeRequest) returns (stream RangeResponse);
}

service ClusterService {
  rpc Join(JoinRequest) returns (JoinResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc GetLeader(GetLeaderRequest) returns (GetLeaderResponse);
}

enum PutMode {
  PUT_MODE_UNSPECIFIED = 0;
  PUT_MODE_UPSERT = 1;
  PUT_MODE_INSERT = 2;
  PUT_MODE_UPDATE = 3;
}

message GetRequest {
  bytes key = 1;
}

message GetResponse {
  bytes value = 1;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
  PutMode mode = 3;
}

message PutResponse {
  bool updated = 1;
}

message DeleteRequest {
  bytes key = 1;
}

message DeleteResponse {
  bool deleted = 1;
}

message RangeRequest {
  bytes start = 1;
  bytes stop = 2;
  bool descending = 3;
}

message RangeResponse {
  bytes key = 1;
  bytes value = 2;
}

message JoinRequest {
  string node_id = 1;
  string raft_addr = 2;
}

message JoinResponse {}

message ListMembersRequest {}

message ListMembersResponse {
  repeated ClusterMember members = 1;
}

message ClusterMember {
  string node_id = 1;
  string grpc_addr = 2;
  string raft_addr = 3;
  string serf_addr = 4;
  ClusterMemberStatus status = 5;
  bool raft_voter = 6;
  bool leader = 7;
}

enum ClusterMemberStatus {
  CLUSTER_MEMBER_STATUS_UNSPECIFIED = 0;
  CLUSTER_MEMBER_STATUS_ALIVE = 1;
  CLUSTER_MEMBER_STATUS_LEAVING = 2;
  CLUSTER_MEMBER_STATUS_LEFT = 3;
  CLUSTER_MEMBER_STATUS_FAILED = 4;
}

message GetLeaderRequest {}

message GetLeaderResponse {
  string node_id = 1;
  string raft_addr = 2;
}
